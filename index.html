<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematika Daraja testi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
        }
        .question-card, .form-card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        input.text-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button.option-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 16px;
            cursor: pointer;
            text-align: left;
        }
        button.option-btn:hover {
            opacity: 0.9;
        }
        #quiz-container, #result {
            display: none;
        }
        h2 { font-size: 18px; }
    </style>
</head>
<body>

<div class="container" id="name-container">
    <div class="form-card">
        <h2>Ism va familiyangizni kiriting:</h2>
        <input type="text" id="user-full-name" class="text-input" placeholder="Masalan: Anvar Toshmatov">
        <button class="option-btn" style="text-align: center;" onclick="startQuiz()">Testni boshlash</button>
    </div>
</div>

<div class="container" id="quiz-container">
    <div id="question-header" style="margin-bottom: 10px; font-weight: bold;">Savol <span id="current-q">1</span> / 10</div>
    <div class="question-card">
        <h2 id="question-text">Savol yuklanmoqda...</h2>
        <div id="options-container"></div>
    </div>
</div>

<div class="container" id="result">
    <div class="form-card" style="text-align: center;">
        <h2>Test yakunlandi! 🎉</h2>
        <p>Ishtirokchi: <span id="display-name" style="font-weight: bold;"></span></p>
        <p>Sizning natijangiz: <span id="score" style="font-weight: bold;">0</span> / 10</p>
        <p id="level-desc" style="font-weight: bold; font-size: 16px; margin: 15px 0;"></p>
        <button class="option-btn" style="text-align: center;" onclick="closeApp()">Natijani botga yuborish</button>
    </div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    let userName = "";
    let currentQuestion = 0;
    let score = 0;

    const questions = [
        { type: "Arifmetika", question: "Hisoblang: 45 + 15 * 2 - 30 / 5", options: ["70", "69", "75", "60"], answer: 1 },
        { type: "Tenglama", question: "Tenglamani yeching: 3x - 7 = 14", options: ["x = 5", "x = 7", "x = 8", "x = 6"], answer: 1 },
        { type: "Foiz", question: "200 sonining 25 foizi nechaga teng?", options: ["40", "50", "60", "45"], answer: 1 },
        { type: "Kasrlar", question: "Hisoblang: 3/4 + 1/2", options: ["4/6", "5/4", "1", "2/3"], answer: 1 },
        { type: "Daraja va Ildiz", question: "Hisoblang: √144 + 2³", options: ["16", "20", "18", "24"], answer: 1 },
        { type: "Geometriya", question: "Tomoni 6 sm bo'lgan kvadratning yuzini toping.", options: ["24 sm²", "36 sm²", "12 sm²", "18 sm²"], answer: 1 },
        { type: "Matnli masala", question: "Avtomobil 60 km/soat tezlik bilan 3 soatda qancha masofa bosib o'tadi?", options: ["150 km", "180 km", "120 km", "200 km"], answer: 1 },
        { type: "Ketma-ketlik", question: "Keyingi sonni toping: 2, 6, 12, 20, 30, ...", options: ["40", "42", "45", "48"], answer: 1 },
        { type: "Ehtimollik", question: "Tanga tashlanganda 'gerb' tushish ehtimolligi qanday?", options: ["1", "1/2", "1/4", "0"], answer: 1 },
        { type: "Mantiqiy", question: "Aka 10 yoshda, uka uning yarmiga teng (5 yosh). Aka 50 yoshga kirganda uka necha yoshda bo'ladi?", options: ["25", "40", "45", "50"], answer: 2 }
    ];

    function startQuiz() {
        const inputVal = document.getElementById('user-full-name').value.trim();
        if (!inputVal) {
            alert("Iltimos, ism va familiyangizni kiriting!");
            return;
        }
        userName = inputVal;
        document.getElementById('name-container').style.display = 'none';
        document.getElementById('quiz-container').style.display = 'block';
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQuestion < questions.length) {
            let q = questions[currentQuestion];
            document.getElementById('current-q').innerText = currentQuestion + 1;
            document.getElementById('question-text').innerText = `(${q.type}) ${q.question}`;
            
            let optionsHtml = '';
            q.options.forEach((opt, index) => {
                optionsHtml += `<button class="option-btn" onclick="checkAnswer(${index})">${opt}</button>`;
            });
            document.getElementById('options-container').innerHTML = optionsHtml;
        } else {
            showResult();
        }
    }

    function checkAnswer(selectedIndex) {
        if (selectedIndex === questions[currentQuestion].answer) {
            score++;
        }
        currentQuestion++;
        loadQuestion();
    }

    function showResult() {
        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('result').style.display = 'block';
        document.getElementById('display-name').innerText = userName;
        document.getElementById('score').innerText = score;

        let levelText = "";
        if (score <= 4) levelText = "Darajangiz: Boshlang'ich";
        else if (score <= 7) levelText = "Darajangiz: O'rta";
        else levelText = "Darajangiz: Yuqori / Professional! 🏆";

        document.getElementById('level-desc').innerText = levelText;
    }

    function closeApp() {
        let userId = tg.initDataUnsafe?.user?.id;
        if (!userId) {
            alert("Foydalanuvchi ma'lumotlarini aniqlab bo'lmadi!");
            tg.close();
            return;
        }

        let payload = {
            user_id: userId,
            name: userName,
            score: score
        };

        // Renderdagi veb-servisingiz manzili
        fetch('https://math1010-bot.onrender.com/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(response => {
            tg.close();
        })
        .catch(error => {
            console.error('Xatolik:', error);
            tg.close();
        });
    }
</script>

</body>
</html>
